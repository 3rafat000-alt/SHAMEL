# SHAMEL Model Aliases
# The ONLY file that maps alias → model-id.
# routing.yaml references aliases only — agentlint fails on any raw model ID there.

aliases:
  mechanical: claude-haiku-4-5        # 80% of routine ops
  workhorse:  claude-sonnet-5         # clear-cut coding
  gatekeeper: inherit                 # session frontier model — adversarial checks
  deep:       claude-opus-4-8         # last resort only

policy:
  routing_yaml_may_reference: [mechanical, workhorse, gatekeeper, deep]
  note: "agentlint fails if routing.yaml contains any ID not in this list"
